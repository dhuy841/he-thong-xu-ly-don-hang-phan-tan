services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./Database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: orders
      RABBITMQ_DEFAULT_PASS: orders_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-api:
    build:
      context: .
      dockerfile: OrderApi/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=orders_dev
      RabbitMq__Uri: amqp://orders:orders_dev@rabbitmq:5672/
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  order-worker:
    build:
      context: .
      dockerfile: OrderWorker/Dockerfile
    environment:
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders;Username=orders;Password=orders_dev
      RabbitMq__Uri: amqp://orders:orders_dev@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Uri: amqp://orders:orders_dev@rabbitmq:5672/
    ports:
      - "5002:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
